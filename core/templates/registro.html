{% extends "base.html" %}
{% block title %}Crear cuenta · Taller mecanico{% endblock %}
{% block content %}
<div class="caja" style="max-width:420px;margin:40px auto;">
    <h1>Crear cuenta de cliente</h1>
    <p class="subtitulo">Con esta cuenta reservas una hora para dejar tu vehiculo.</p>
    {% if error %}<p class="error" style="padding:10px;border-radius:8px;">{{ error }}</p>{% endif %}
    <form method="post">
        {% csrf_token %}
        <label for="nombre">Nombre</label>
        <input id="nombre" name="nombre" required>

        <label for="telefono">WhatsApp</label>
        <input id="telefono" name="telefono" placeholder="56911111111">

        <label for="username">Usuario</label>
        <input id="username" name="username" required>

        <label for="password">Contrasena</label>
        <input id="password" type="password" name="password" required>

        <button type="submit">Crear cuenta</button>
    </form>
    <p class="muted"><a href="{% url 'login' %}">Ya tengo cuenta</a></p>
</div>
{% endblock %}
